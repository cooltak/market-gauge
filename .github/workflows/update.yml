name: Update market data

on:
  schedule:
    # 米国市場が開いている時間帯（UTC 13:00〜21:59 ＝ 日本時間 22:00〜翌6:59）に15分ごと。
    # GitHub の定期実行は毎時0分・30分に混雑して抜けやすいので、半端な分にずらしている
    - cron: '7,22,37,52 13-21 * * 1-5'
    # 引け後の確定値（日本時間 朝8:13ごろ）
    - cron: '13 23 * * 1-5'
  workflow_dispatch:
  # 取得スクリプトや設定を変えたときもすぐ実行して確認
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch data
        run: node scripts/fetch.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet data.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
